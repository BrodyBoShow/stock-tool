<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Single theme-color meta, updated to the RESOLVED theme (not the OS pref)
         by the script below + the ThemeProvider, so the mobile browser chrome
         tracks the manual toggle instead of desyncing from it. -->
    <meta name="theme-color" id="theme-color" content="#faf7f2" />
    <!-- Anti-FOUC: stamp the theme onto <html> BEFORE first paint so there is no
         flash of the wrong theme. Explicit choice (localStorage) wins; otherwise
         follow the OS. The ThemeProvider reads this already-applied attribute. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
          var tc = document.getElementById('theme-color')
          if (tc) tc.setAttribute('content', t === 'dark' ? '#0e0c0a' : '#faf7f2')
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="US equity factor screener — nightly percentile rankings, not investment advice."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>StockBud — US Equity Factor Screener</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
