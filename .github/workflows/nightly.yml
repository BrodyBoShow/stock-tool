# Nightly pipeline: incremental price refresh -> price sanity -> factor scoring,
# then a best-effort FRED macro-context refresh (rates / VIX / CPI).
#
# Schedule: 23:30 UTC every day (~6:30 PM US Eastern when DST is off,
# ~7:30 PM when DST is on). GitHub Actions cron is always UTC and does not
# adjust for DST; the ~1-hour seasonal shift is acceptable for this batch job.
#
# The macro step is non-blocking (continue-on-error) and runs only when the
# FRED_API_KEY secret is set, so it never breaks the critical scoring run.
#
# On failure GitHub automatically emails the repository owner via the default
# Actions notification settings — no extra configuration required.

name: Nightly pipeline

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly pipeline
        run: python scripts/run_nightly.py

      # Macro is CONTEXT ONLY (writes macro_series, never the scoring tables).
      # Best-effort: skipped if the FRED key isn't set, and a FRED outage won't
      # fail the workflow or the scoring run above.
      - name: Refresh macro context (FRED)
        if: ${{ env.FRED_API_KEY != '' }}
        continue-on-error: true
        run: python scripts/ingest_macro.py

      # Insider transactions (Form 4) — CONTEXT ONLY, never scoring tables.
      # Incremental by accession, so nightly deltas are small; --max-fetches
      # bounds the run so an unfinished backfill rolls to the next night.
      # Runs BEFORE AI pre-generation so fresh insider data grounds the briefs.
      - name: Refresh insider transactions (Form 4)
        continue-on-error: true
        run: python scripts/ingest_insiders.py --max-fetches 6000

      # 8-K material events — CONTEXT ONLY. One submissions read per company
      # (no document fetch), incremental by accession.
      - name: Refresh material events (8-K)
        continue-on-error: true
        run: python scripts/ingest_events.py --max-fetches 1200

      # NOTE: AI pre-generation (Decision Briefs, 10-K summaries, deep filing
      # analysis) is intentionally NOT run nightly — it would spend on the
      # Anthropic API every night regardless of use. Instead, all AI artifacts
      # generate ON DEMAND when a deep-dive page is first opened and are cached
      # (briefs by score_date, summaries/filing-analysis by accession), so spend
      # tracks actual usage. To warm them manually, run scripts/pregenerate_ai.py.
