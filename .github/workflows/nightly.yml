# Nightly pipeline: price refresh -> price sanity -> fundamentals refresh ->
# derived metrics -> factor scoring, then best-effort context refreshes.
#
# Schedule: 23:30 UTC every day (~6:30 PM US Eastern when DST is off,
# ~7:30 PM when DST is on). GitHub Actions cron is always UTC and does not
# adjust for DST; the ~1-hour seasonal shift is acceptable for this batch job.
#
# Fundamentals (resume=False) + metrics were added to the nightly on 2026-06-12
# so new 10-Q/10-K facts land in ranks the next morning. They add ~30-90 min
# on a CI IP (SEC allows 10 req/s with a proper user agent), well within the
# 300-minute timeout.
#
# The macro step is non-blocking (continue-on-error) and runs only when the
# FRED_API_KEY secret is set, so it never breaks the critical scoring run.
#
# On failure GitHub automatically emails the repository owner via the default
# Actions notification settings — no extra configuration required.

name: Nightly pipeline

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  nightly:
    runs-on: ubuntu-latest
    # ~6k active names: the incremental price refresh is one yfinance request
    # per ticker and sleeps through rate-limit cooldowns, so give it room.
    timeout-minutes: 300

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Free/fast primary for the on-open AI (Decision Brief, Ask StockBud).
      # Optional — empty just falls back to Anthropic (Haiku).
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Set this repo secret to make the nightly use Massive for prices; empty =
      # run_nightly falls back to yfinance automatically.
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      # Brokerage auto-sync (SnapTrade). PORTFOLIO_TOKEN_KEY decrypts the stored
      # read-only OAuth tokens; SNAPTRADE_OAUTH_CLIENT_ID refreshes them. Both
      # empty = the sync step below is skipped (no-op), so the nightly still runs.
      PORTFOLIO_TOKEN_KEY: ${{ secrets.PORTFOLIO_TOKEN_KEY }}
      SNAPTRADE_OAUTH_CLIENT_ID: ${{ secrets.SNAPTRADE_OAUTH_CLIENT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Supervised: a Supabase pooler drop mid-write can hang the client inside
      # a socket read with no timeout; the supervisor kills and relaunches on
      # stdout silence (cooldown announcements extend the allowance). Every
      # pipeline step is idempotent/incremental, so restarts are safe.
      - name: Run nightly pipeline
        run: >
          python scripts/supervise_backfill.py --label nightly --stall 900 --
          python -u scripts/run_nightly.py

      # Per-security historical risk bands — CONTEXT ONLY (writes security_risk,
      # never scoring/rank tables; screener attaches the band AFTER ranking).
      # Sequential after the pipeline so it never overlaps the heavy steps'
      # disk IO. Best-effort: a failure leaves yesterday's rows (staleness is
      # visible via as_of_date).
      - name: Compute security risk metrics
        continue-on-error: true
        run: python -m engine.risk_metrics

      # Brokerage auto-sync (SnapTrade) — pulls each connected link's latest
      # activity + positions into portfolio_transactions so linked portfolios
      # track the broker without a manual "Sync" click. READ-ONLY at the broker
      # (never trades); writes ONLY the portfolio ledger, never scoring/rank
      # tables. Runs after the price refresh so reconcile valuations use fresh
      # closes. Gated on the OAuth secrets; continue-on-error + the script exits 0
      # even on a bad link, so an expired token can't fail the night.
      - name: Sync connected brokerages (SnapTrade)
        if: ${{ env.PORTFOLIO_TOKEN_KEY != '' && env.SNAPTRADE_OAUTH_CLIENT_ID != '' }}
        continue-on-error: true
        run: python scripts/sync_brokerages.py

      # Macro is CONTEXT ONLY (writes macro_series, never the scoring tables).
      # Best-effort: skipped if the FRED key isn't set, and a FRED outage won't
      # fail the workflow or the scoring run above.
      - name: Refresh macro context (FRED)
        if: ${{ env.FRED_API_KEY != '' }}
        continue-on-error: true
        run: python scripts/ingest_macro.py

      # Commodity forecasts (EIA STEO) — CONTEXT ONLY (writes commodity_forecasts,
      # never the scoring tables). Powers the deep-dive "forward commodity
      # backdrop" caveat. Best-effort: skipped if the EIA key isn't set; an EIA
      # outage won't fail the workflow or the scoring run above.
      - name: Refresh commodity forecasts (EIA STEO)
        if: ${{ env.EIA_API_KEY != '' }}
        continue-on-error: true
        run: python scripts/ingest_commodity_forecasts.py

      # News coverage-volume spikes for watchlisted names (GDELT, free, no key).
      # CONTEXT ONLY (writes news_signals, never scoring). Best-effort: GDELT is
      # rate-limited (globally throttled in-engine) and non-fatal on outage.
      - name: Refresh news signals (GDELT)
        continue-on-error: true
        run: python scripts/ingest_news_signals.py

      # Insider transactions (Form 4) — CONTEXT ONLY, never scoring tables.
      # Incremental by accession, so steady-state nightly deltas are small.
      # The expanded universe still has a one-time Form 4 backfill to chew
      # through (~150k fetches), so the cap is raised to catch up over a few
      # nights, then it settles into small deltas. Supervised so a Supabase
      # pooler drop mid-write restarts instead of eating the job timeout;
      # incremental, so the restart resumes where it left off.
      - name: Refresh insider transactions (Form 4)
        continue-on-error: true
        run: >
          python scripts/supervise_backfill.py --label nightly-insiders --stall 900 --
          python -u scripts/ingest_insiders.py --max-fetches 40000

      # 8-K material events — CONTEXT ONLY. One submissions read per company
      # (no document fetch), incremental by accession.
      - name: Refresh material events (8-K)
        continue-on-error: true
        run: python scripts/ingest_events.py --max-fetches 1200

      # Filing catalog — records EVERY research-relevant form (20-F/40-F/6-K,
      # proxies, ownership, offerings, …) into `filings` so the deep-dive can
      # browse a company's full filing history. CONTEXT ONLY, one submissions
      # read per company, incremental by accession. Budgeted so the one-time
      # first-run backfill spreads over a few nights (kind to the disk-IO burst
      # budget); steady-state deltas are tiny.
      - name: Refresh filing catalog (all form types)
        continue-on-error: true
        run: python scripts/ingest_filings_catalog.py --max-fetches 1500

      # Fund/ETF prices — the Funds & ETFs tab. Funds are is_active=false (kept
      # out of the factor screener), so the main active-only refresh skips them;
      # this incremental pass keeps their daily closes — and the tab's trailing
      # returns — current. Supervised so a pooler drop restarts cleanly.
      - name: Refresh fund/ETF prices
        continue-on-error: true
        run: >
          python scripts/supervise_backfill.py --label nightly-funds --stall 900 --
          python -u scripts/refresh_fund_prices.py

      # Fund/ETF metadata — the Funds tab's AUM / average volume / NAV / issuer /
      # category + top-10 equity holdings, sourced FREE from yfinance. CONTEXT
      # ONLY (writes etf_metadata / etf_holdings, never scoring tables). Slow-
      # moving, idempotent, throttled; best-effort so a yfinance hiccup can't
      # fail the night.
      - name: Refresh fund/ETF metadata + holdings (yfinance)
        continue-on-error: true
        run: python -u scripts/ingest_etf_meta.py

      # AI warm: pre-generate Decision Briefs for the WATCHLIST only
      # (--top-n 0 --briefs-only) so the stocks you track open instantly instead
      # of showing "Synthesizing…" on first open. Briefs cache per scoring
      # snapshot — one Haiku call each (~$0.006), idempotent, so this is
      # pennies/month for a small watchlist. Everything else (briefs for
      # non-watchlist names, 10-K summaries, deep filing analysis) stays ON
      # DEMAND, cached on first page open, so spend still tracks actual usage.
      # Gated on the key; continue-on-error so a model outage never breaks the
      # pipeline. Runs last, after scoring, so briefs reflect the night's ranks.
      # Pre-warm Decision Briefs for the hot set (every watched OR held ticker)
      # so those deep-dive pages open instantly. Groq-first = free + fast (~2-4s
      # each), Anthropic fallback. Bounded to the hot set, skips still-valid
      # cached briefs — a nightly pass is cents at most (free with a Groq key).
      - name: Warm hot-set Decision Briefs (Groq → Haiku)
        if: ${{ env.GROQ_API_KEY != '' || env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        run: python scripts/prewarm_briefs.py --sleep 0.3
