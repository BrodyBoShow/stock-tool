# Monthly point-in-time factor backtest. Runs in the cloud (nobody runs it by
# hand) and commits the latest results to reports/backtest_latest.md, so you
# just open that file on GitHub to see how the model is holding up.
#
# Schedule: 06:00 UTC on the 2nd of each month — after a new month of prices
# and any month-end filings have landed, so the new rebalance has real data.
# Also runnable on demand (workflow_dispatch) right after you change weights.

name: Monthly factor backtest

on:
  schedule:
    - cron: "0 6 2 * *"
  workflow_dispatch:
    inputs:
      config:
        description: "Score config to backtest (default v2_linear). e.g. v3_linear to A/B the vol-scaled-momentum variant. Non-default configs store a row but don't touch the committed report."
        default: "v2_linear"
        required: false

permissions:
  contents: write   # to commit the refreshed report

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # ~47 monthly re-scores of the full universe

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --store feeds the Lab page (backtest_results table); --out keeps the
      # repo-viewable Markdown report.
      # The scheduled run uses v2_linear and refreshes the committed report. A
      # manual run with a non-default config (e.g. v3_linear) stores its own
      # backtest_results row for A/B comparison but leaves the report untouched.
      - name: Run backtest -> Lab page (+ report for the default config)
        run: |
          CFG="${{ github.event.inputs.config }}"
          CFG="${CFG:-v2_linear}"
          echo "backtest config = $CFG"
          if [ "$CFG" = "v2_linear" ]; then
            python scripts/run_backtest.py --store --config v2_linear --out reports/backtest_latest.md
          else
            python scripts/run_backtest.py --store --config "$CFG"
          fi

      - name: Commit refreshed report (only if it changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/backtest_latest.md
          if git diff --cached --quiet; then
            echo "No change in backtest report."
          else
            git commit -m "Backtest: refresh reports/backtest_latest.md [skip ci]"
            git push
          fi
